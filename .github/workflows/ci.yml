name: ci

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # checks out into .../appstore/appstore; ROOT_URLCONF 'appstore.urls' needs the repo dir named appstore
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Browser system libraries
        run: make .venv/.installed && .venv/bin/python -m playwright install-deps chromium

      - name: make test
        run: make test

  integration-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integration/package-lock.json

      - name: Browser system libraries
        working-directory: integration
        run: npm ci --no-audit --no-fund && npx playwright install-deps chromium firefox

      - name: make integration-test
        run: make integration-test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            integration/playwright-report/
            integration/test-results/
          retention-days: 7
