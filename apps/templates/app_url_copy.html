<div class="cy-app-url-copy">
    <label for="cy-app-url"><strong>{{ url_label }}</strong></label>
    <input id="cy-app-url" type="text" value="{{ app_url }}" readonly
           aria-describedby="cy-app-url-status">
    <button type="button" class="btn btn-small cy-app-copy-url-btn" hidden>Copy URL</button>
    <p id="cy-app-url-status" class="muted" role="status" aria-live="polite">Select the URL to copy it manually.</p>
</div>
