<div class="cy-app-url-copy">
    <label for="cy-app-url"><strong>{{ url_label }}</strong></label>
    <div class="cy-app-url-line">
        <input id="cy-app-url" type="text" value="{{ app_url }}" readonly
               aria-describedby="cy-app-url-status">
        <button type="button" class="cy-app-copy-url-btn" title="Copy {{ url_label }}"
                aria-label="Copy {{ url_label }}" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" aria-hidden="true" focusable="false">
                <rect x="8" y="8" width="12" height="12" rx="2"></rect>
                <path d="M16 8V4H4v12h4"></path>
            </svg>
        </button>
    </div>
    <p id="cy-app-url-status" class="muted" role="status" aria-live="polite">Select the URL to copy it manually.</p>
</div>
